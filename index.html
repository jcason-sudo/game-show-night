<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>Game Show Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Game Show Night, look B: deep teal, yellow, coral and sky blue, set in Barlow Condensed.
   Page #0F3B4C, panels #0A2C39, light #EEF3F1, yellow #F9D648, coral #F0643A, sky #5BC0EB, green #7BD389.
   Flexbox only, no grid and no CSS variables, so older TV browsers can draw it. */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #EEF3F1; color: #0A2C39; font-family: 'Barlow', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; -webkit-text-size-adjust: 100%; }
button, input { font-family: inherit; }
button { touch-action: manipulation; cursor: pointer; }
.hide { display: none !important; }
/* the fat display face */
.home h1, .big, .tm .ts, .logo, .joinbox b, .overlay h1, .overlay button, .paused, .h1, .h2, .status.go, .lobby .qr .code, .lobby .col h3, .opt .l, .opt .n, .bcell, .clue, .answer, .zval, .slot .no, .slot .pt, .strikes b, .pot, .bigx, .bar .bf, .ptop .sc, .pbody h2, .watch, .pbtn.go, .buzz, .tiles button, .bossbar button { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; }

/* ---------- home ---------- */
.home { max-width: 560px; margin: 0 auto; padding: 28px 20px; text-align: center; }
.home h1 { font-size: 52px; margin: 10px 0 4px; color: #F0643A; line-height: 1; }
.home p { font-size: 18px; font-weight: 800; }
.big { display: block; width: 100%; border: 0; border-radius: 999px; padding: 20px 16px; margin: 16px 0; font-size: 24px; color: #FFFFFF; background: #5BC0EB; box-shadow: 0 7px 0 #0A2C39; }
.big.red { background: #F0643A; }
.big:focus { outline: 5px solid #F9D648; }
.field { width: 100%; font-size: 24px; padding: 16px 22px; border: 4px solid #0A2C39; border-radius: 999px; background: #FFFFFF; color: #0A2C39; text-align: center; font-weight: 800; }
.note { font-size: 15px; margin-top: 22px; }

/* ---------- TV screen ---------- */
.scr { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; background: #0A2C39; color: #0A2C39; }
.rays { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.top { position: relative; height: 12vh; -webkit-flex: none; flex: none; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 1.4vh 2.4vw 0; }
.tm { width: 27vw; height: 9.4vh; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; padding: 0 0.8vh 0 2vw; color: #FFFFFF; border-radius: 99vh; border: 0.7vh solid #EEF3F1; }
.tm.t0 { background: #F0643A; }
.tm.t1 { background: #5BC0EB; -webkit-flex-direction: row-reverse; flex-direction: row-reverse; padding: 0 2vw 0 0.8vh; }
.tm .tn { font-size: 3.6vh; font-weight: 900; white-space: nowrap; overflow: hidden; }
.tm .ts { font-size: 5.6vh; line-height: 1; background: #EEF3F1; color: #0A2C39; border-radius: 99vh; padding: 0.7vh 2.2vh; }
.tm.ctrl { border-color: #F9D648; }
.mid { -webkit-flex: 1; flex: 1; text-align: center; }
.logo { font-size: 6.6vh; line-height: 1; color: #F9D648; }
.sub { font-size: 2.6vh; color: #EEF3F1; font-weight: 800; margin-top: 0.4vh; }
.stagewrap { position: relative; -webkit-flex: 1; flex: 1; padding: 1.2vh 4vw 1.6vh; display: -webkit-flex; display: flex; min-height: 0; }
.frame { -webkit-flex: 1; flex: 1; background: #F9D648; border-radius: 4.4vh; padding: 0 2vh; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; min-height: 0; }
.bulbs { height: 3.2vh; -webkit-flex: none; flex: none; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; padding: 0 2.4vw; }
.bulbs i { display: block; width: 1.5vh; height: 1.5vh; border-radius: 50%; background: #EEF3F1; }
.stage { -webkit-flex: 1; flex: 1; min-height: 0; position: relative; overflow: hidden; background: #EEF3F1; border-radius: 2.8vh; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; padding: 1vh 2vw; text-align: center; }
.stripes { position: relative; -webkit-flex: none; flex: none; }
.stripes i { display: block; height: 0.9vh; }
.stripes .s0 { background: #F0643A; } .stripes .s1 { background: #F9D648; } .stripes .s2 { background: #5BC0EB; }
.foot { position: relative; height: 16vh; -webkit-flex: none; flex: none; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; background: #EEF3F1; padding: 0 2.4vw; }
.host { width: 16vh; height: 15vh; -webkit-flex: none; flex: none; }
.bubble { -webkit-flex: 1; flex: 1; margin: 0 2vw; font-size: 3.5vh; font-weight: 800; line-height: 1.22; max-height: 13.5vh; overflow: hidden; text-align: left; }
.joinbox { width: 25vw; -webkit-flex: none; flex: none; font-size: 2.2vh; font-weight: 800; text-align: right; line-height: 1.3; }
.joinbox b { font-size: 5.4vh; letter-spacing: 0.6vh; color: #F0643A; line-height: 1; }
.dots i { display: inline-block; width: 1.5vh; height: 1.5vh; border-radius: 50%; background: #BFD3D0; margin-left: 0.5vh; }
.dots i.on { background: #5BC0EB; }
.menubtn { position: absolute; right: 0.6vw; top: 13vh; font-size: 2.2vh; font-weight: 800; background: #EEF3F1; color: #0A2C39; border: 0; border-radius: 99vh; padding: 0.7vh 1.6vh; opacity: 0.5; z-index: 5; }
.menubtn:focus { opacity: 1; outline: 0.5vh solid #F9D648; }
.menu { position: absolute; right: 1vw; top: 18vh; background: #EEF3F1; border: 0.6vh solid #0A2C39; border-radius: 3vh; padding: 1.5vh; z-index: 6; width: 36vh; }
.menu button { display: block; width: 100%; font-size: 2.8vh; font-weight: 800; margin: 0.6vh 0; padding: 1.2vh; border: 0; border-radius: 99vh; background: #FFFFFF; color: #0A2C39; }
.menu button:focus { outline: 0.5vh solid #F0643A; }
.overlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #0A2C39; z-index: 20; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; text-align: center; }
.overlay h1 { font-size: 15vh; margin: 0; color: #F9D648; line-height: 1; }
.overlay p { font-size: 4vh; color: #EEF3F1; font-weight: 800; }
.overlay button { font-size: 6vh; padding: 2.6vh 6vw 3vh; border: 0; border-radius: 99vh; background: #F0643A; color: #FFFFFF; margin-top: 3vh; box-shadow: 0 1.2vh 0 #06202A; }
.overlay button:focus { outline: 1vh solid #F9D648; }
.paused { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: rgba(58,34,20,0.88); z-index: 4; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; font-size: 14vh; color: #F9D648; }

.h1 { font-size: 9vh; color: #F0643A; margin: 0 0 1.5vh; line-height: 1.05; }
.h2 { font-size: 5.6vh; margin: 0 0 1.4vh; line-height: 1.1; }
.tag { display: inline-block; font-size: 3vh; font-weight: 900; color: #FFFFFF; background: #5BC0EB; border-radius: 99vh; padding: 0.6vh 2.4vh; margin-bottom: 1.4vh; }
.tag.yel { background: #F9D648; color: #0A2C39; } .tag.red { background: #F0643A; }
.status { font-size: 4vh; font-weight: 900; margin-top: 1.4vh; }
.status.go { display: inline-block; background: #F0643A; color: #FFFFFF; border-radius: 99vh; padding: 1vh 4vh 1.3vh; -webkit-animation: pulse 0.7s infinite; animation: pulse 0.7s infinite; }
.status.go span { color: #FFFFFF; }
.t0c { color: #F0643A; } .t1c { color: #5BC0EB; }
.timer { -webkit-flex: none; flex: none; width: 56vw; height: 1.8vh; background: #0A2C39; border-radius: 1vh; overflow: hidden; margin-top: 1.6vh; padding: 0.4vh; }
.timer i { display: block; height: 100%; width: 100%; background: #F9D648; border-radius: 1vh; }
.lineup { font-size: 2.5vh; font-weight: 800; margin-top: 0.8vh; }
.lineup b { color: #F0643A; font-weight: 900; }
.tally { font-size: 3.4vh; font-weight: 800; margin-top: 1vh; }

/* lobby */
.lobby { display: -webkit-flex; display: flex; width: 100%; -webkit-flex: 1; flex: 1; min-height: 0; -webkit-align-items: center; align-items: center; }
.lobby .qr { width: 32vw; text-align: center; }
.lobby .qr svg, .lobby .qr img { width: 31vh; height: 31vh; border-radius: 2vh; }
.lobby .qr .url { font-size: 2.6vh; font-weight: 800; margin-top: 0.4vh; word-break: break-all; }
.lobby .qr .code { font-size: 8.4vh; letter-spacing: 1.2vh; color: #F0643A; line-height: 1; }
.lobby .teams { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; height: 96%; }
.lobby .col { -webkit-flex: 1; flex: 1; margin: 0 0.8vw; border-radius: 3vh; background: #FFFFFF; padding: 1.4vh; overflow: hidden; text-align: left; }
.lobby .col h3 { margin: 0 0 1vh; font-size: 4vh; color: #FFFFFF; border-radius: 99vh; padding: 0.6vh 2vh; text-align: center; }
.lobby .col.t0 h3 { background: #F0643A; } .lobby .col.t1 h3 { background: #5BC0EB; }
.chip { font-size: 3.2vh; font-weight: 800; padding: 0.4vh 1vh; line-height: 1.15; }
.chip small { font-size: 2vh; white-space: nowrap; color: #5BC0EB; font-weight: 900; }
.chip.off { opacity: 0.35; }

/* options (vote) */
.opts { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; width: 84vw; -webkit-justify-content: center; justify-content: center; }
.opt { width: 39vw; margin: 0.8vh 1vw; border-radius: 99vh; padding: 1.3vh 1.6vw 1.3vh 1.3vh; font-size: 4.2vh; font-weight: 900; color: #FFFFFF; text-align: left; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
.opt .l { -webkit-flex: none; flex: none; width: 6vh; height: 6vh; line-height: 6vh; text-align: center; border-radius: 50%; background: #EEF3F1; color: #0A2C39; margin-right: 1.2vw; }
.opt .n { margin-left: auto; padding-left: 1vw; }
.o0 { background: #F0643A; } .o1 { background: #5BC0EB; } .o2 { background: #F9D648; color: #0A2C39; } .o3 { background: #0A2C39; }
.opt.dim { opacity: 0.25; }
.opt.win { box-shadow: 0 0 0 0.7vh #EEF3F1, 0 0 0 1.5vh #0A2C39; }

/* board */
.board { display: -webkit-flex; display: flex; width: 86vw; height: 45vh; }
.bcol { -webkit-flex: 1; flex: 1; margin: 0 0.5vw; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
.bhead { height: 9vh; background: #5BC0EB; color: #FFFFFF; font-size: 2.8vh; font-weight: 900; border-radius: 2vh; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; padding: 0 0.5vw; line-height: 1.1; }
.bcell { -webkit-flex: 1; flex: 1; margin-top: 1vh; background: #FFFFFF; border: 0.5vh solid #0A2C39; border-radius: 99vh; font-size: 5vh; color: #F0643A; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
.bcell.used { color: #EEF3F1; background: #EEF3F1; border-color: #24505F; }
.clue { font-size: 6.6vh; line-height: 1.1; max-width: 80vw; }
.answer { font-size: 8.4vh; color: #5BC0EB; line-height: 1.05; margin: 1.2vh 0 0.6vh; }

/* zoom */
.zwrap { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
.zf { position: relative; width: 78vh; height: 49vh; overflow: hidden; border: 0.8vh solid #0A2C39; border-radius: 3vh; background: #0A2C39; }
.zi { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.zt { position: absolute; background: #0A2C39; border: 1px solid #0F3B4C; }
.zside { width: 30vw; padding-left: 3vw; text-align: left; }
.zval { font-size: 12vh; color: #F0643A; line-height: 1; }

/* phrase and word tiles */
.phrase { max-width: 84vw; }
.word { display: inline-block; white-space: nowrap; margin: 0.7vh 1.4vw; }
.lt { font-weight: 900; display: inline-block; width: 6vh; height: 8vh; line-height: 8vh; margin: 0 0.3vh; background: #FFFFFF; border: 0.5vh solid #0A2C39; border-radius: 1.4vh; font-size: 5.6vh; text-align: center; vertical-align: top; }
.lt.p { background: none; border-color: transparent; width: 3vh; }
.lt.new { background: #F9D648; }
.lt.xl { width: 8vh; height: 10.4vh; line-height: 10.4vh; font-size: 7.4vh; margin: 0 0.5vh; }
.used { font-size: 3.2vh; font-weight: 800; letter-spacing: 0.6vh; margin-top: 1.2vh; }
.miss { font-size: 3.6vh; font-weight: 900; margin-top: 0.8vh; }
.miss i { display: inline-block; width: 4.6vh; height: 4.6vh; line-height: 3.8vh; border-radius: 50%; border: 0.5vh solid #0A2C39; margin: 0 0.4vh; font-style: normal; color: #FFFFFF; vertical-align: middle; }
.miss i.x { background: #F0643A; border-color: #F0643A; }

/* survey says */
.fwrap { display: -webkit-flex; display: flex; width: 84vw; -webkit-align-items: center; align-items: center; }
.slots { -webkit-flex: 1; flex: 1; }
.slot { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; height: 6.6vh; margin: 0.7vh 0; border-radius: 99vh; background: #0A2C39; color: #EEF3F1; font-size: 3.8vh; font-weight: 900; padding: 0 2vw 0 0.8vh; text-align: left; }
.slot .no { -webkit-flex: none; flex: none; width: 5vh; height: 5vh; line-height: 5vh; text-align: center; border-radius: 50%; background: #F9D648; color: #0A2C39; margin-right: 1.2vw; }
.slot .pt { margin-left: auto; color: #F0643A; }
.slot.shown { background: #FFFFFF; color: #0A2C39; box-shadow: inset 0 0 0 0.5vh #0A2C39; }
.slot.shown.missed { opacity: 0.55; }
.slot .vt { font-size: 2.4vh; margin-left: 1vw; font-weight: 800; }
.fside { width: 24vw; padding-left: 2vw; }
.strikes b { display: inline-block; font-size: 8vh; color: #24505F; margin: 0 0.6vh; line-height: 1; }
.strikes b.x { color: #F0643A; }
.pot { font-size: 8vh; line-height: 1; }
.bigx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; font-size: 46vh; color: #F0643A; -webkit-animation: flash 1.1s forwards; animation: flash 1.1s forwards; pointer-events: none; z-index: 7; }

/* scores */
.bars { width: 74vw; }
.bar { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin: 1.6vh 0; }
.bar .bn { width: 22vw; text-align: right; padding-right: 2vw; font-size: 4.6vh; font-weight: 900; }
.bar .bt { -webkit-flex: 1; flex: 1; height: 8.4vh; background: #FFFFFF; border-radius: 99vh; overflow: hidden; text-align: left; }
.bar .bf { height: 100%; color: #FFFFFF; font-size: 5.6vh; line-height: 8.4vh; padding-left: 1.6vw; white-space: nowrap; min-width: 12vw; border-radius: 99vh; }
.bf.t0 { background: #F0643A; } .bf.t1 { background: #5BC0EB; }
.how { font-size: 4vh; font-weight: 800; text-align: left; line-height: 1.5; }
.how div:before { content: '\2022  '; color: #F0643A; font-weight: 900; }
.conf { position: absolute; top: -4vh; width: 1.6vh; height: 2.6vh; -webkit-animation: fall 3.4s linear infinite; animation: fall 3.4s linear infinite; }

/* host */
.hostbob { -webkit-animation: bob 2.6s ease-in-out infinite; animation: bob 2.6s ease-in-out infinite; }
.talk .hostmouth { -webkit-animation: talk 0.28s infinite; animation: talk 0.28s infinite; -webkit-transform-origin: 117px 110px; transform-origin: 117px 110px; }
@-webkit-keyframes bob { 0%,100% { -webkit-transform: translateY(0); } 50% { -webkit-transform: translateY(-4px); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@-webkit-keyframes talk { 0%,100% { -webkit-transform: scaleY(1); } 50% { -webkit-transform: scaleY(0.25); } }
@keyframes talk { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.25); } }
@-webkit-keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
@-webkit-keyframes flash { 0% { opacity: 0; -webkit-transform: scale(0.4); } 20% { opacity: 1; -webkit-transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
@keyframes flash { 0% { opacity: 0; transform: scale(0.4); } 20% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
@-webkit-keyframes fall { 0% { -webkit-transform: translateY(0) rotate(0deg); } 100% { -webkit-transform: translateY(80vh) rotate(540deg); } }
@keyframes fall { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(80vh) rotate(540deg); } }

/* ---------- phone ---------- */
.ph { max-width: 560px; margin: 0 auto; min-height: 100%; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; background: #EEF3F1; }
.ptop { padding: 12px 16px; background: #0A2C39; color: #EEF3F1; font-size: 18px; font-weight: 900; display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between; -webkit-align-items: center; align-items: center; box-shadow: 0 7px 0 #F0643A, 0 14px 0 #F9D648, 0 21px 0 #5BC0EB; margin-bottom: 21px; }
.ptop .pill { border-radius: 999px; padding: 7px 16px; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
.ptop.t0 .pill { background: #F0643A; } .ptop.t1 .pill { background: #5BC0EB; }
.ptop .sc { font-size: 24px; color: #F9D648; white-space: nowrap; }
.pnote { background: #5BC0EB; color: #FFFFFF; font-size: 18px; font-weight: 900; padding: 10px 14px; text-align: center; }
.pnote.bad { background: #F0643A; }
.pbody { -webkit-flex: 1; flex: 1; padding: 18px 18px 116px; text-align: center; }
.pbody h2 { font-size: 30px; margin: 10px 0 8px; color: #F0643A; line-height: 1.1; }
.pbody h3 { font-size: 20px; font-weight: 900; margin: 22px 0 8px; }
.pbody p { font-size: 19px; font-weight: 800; margin: 8px 0; line-height: 1.35; }
.pbody .q { font-size: 22px; font-weight: 900; margin: 6px 0 12px; line-height: 1.25; }
.pbody .field { margin: 6px 0 14px; }
.watch { font-size: 26px; color: #5BC0EB; margin-top: 30px; }
.pbtn { display: block; width: 100%; border: 0; border-radius: 24px; padding: 17px 18px; margin: 0 0 16px; font-size: 21px; font-weight: 900; color: #FFFFFF; text-align: left; min-height: 64px; box-shadow: 0 6px 0 #0A2C39; }
.pbtn.c { text-align: center; }
.pbtn[disabled] { opacity: 0.35; }
.pbtn.sel { box-shadow: 0 0 0 4px #EEF3F1, 0 0 0 9px #F9D648; }

.pbtn.plain.sel { background: #F9D648; box-shadow: inset 0 0 0 3px #0A2C39; }
.pbtn.go { background: #F9D648; color: #0A2C39; text-align: center; font-size: 26px; border-radius: 999px; margin-top: 10px; }
.pbtn.dark { background: #5BC0EB; text-align: center; font-size: 24px; }
.half { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-justify-content: space-between; justify-content: space-between; }
.half .pbtn { width: 48.5%; padding: 12px 8px; min-height: 58px; font-size: 17px; }
.buzz { width: 236px; height: 236px; border-radius: 50%; border: 18px solid #F9D648; background: #F0643A; color: #FFFFFF; font-size: 52px; margin: 40px auto 26px; display: block; -webkit-user-select: none; user-select: none; box-shadow: 0 0 0 14px #0A2C39, inset 0 -14px 0 rgba(58,34,20,0.28), inset 0 9px 0 rgba(255,255,255,0.22), 0 30px 30px rgba(58,34,20,0.3); }
.buzz.wait { background: #24505F; color: #0A2C39; box-shadow: 0 0 0 14px #0A2C39, inset 0 -14px 0 rgba(58,34,20,0.15); }
.buzz.sent { background: #5BC0EB; }
.tiles { display: -webkit-flex; display: flex; }
.tiles .tc { -webkit-flex: 1; flex: 1; margin: 0 2px; min-width: 0; }

.keys button { border: 0; border-radius: 8px; background: #EEF3F1; color: #0A2C39; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 26px; }
.pmask { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; } .pmask.big2 { color: #F9D648; }
.pbody h2.turn { background: #F9D648; color: #0A2C39; border-radius: 12px; }
.bossbar { background: #0A2C39; box-shadow: 0 -2px 0 #24505F; }
.bossbar button { background: #F9D648; color: #0A2C39; border-radius: 10px; font-size: 24px; }
.bossbar button.alt { background: #EEF3F1; color: #0A2C39; font-family: 'Barlow', sans-serif; font-weight: 700; }
.sheet { background: #0A2C39; border-top: 4px solid #F9D648; color: #EEF3F1; }
.banner { background: #F9D648; color: #0A2C39; font-weight: 700; }
.prow { border-top-color: #24505F; }
.tdot { background: #24505F; color: #EEF3F1; border-radius: 8px; font-weight: 700; opacity: 0.55; }
.tdot.tb0, .tdot.tb1, .tdot.tb2, .tdot.tb3, .tdot.tb4 { color: #0A2C39; }
.tdot.tb0 { background: #F0643A; } .tdot.tb1 { background: #5BC0EB; } .tdot.tb2 { background: #7BD389; } .tdot.tb3 { background: #B79CED; } .tdot.tb4 { background: #E8C39E; }
.tdot.on { opacity: 1; box-shadow: 0 0 0 3px #F9D648; }
.tdot.rm { background: none; color: #F0643A; box-shadow: inset 0 0 0 2px #F0643A; opacity: 1; }
.tdot.rm.on { background: #F0643A; color: #0A2C39; }
.trow b { color: #F9D648; }
.plist b.t0c, .plist b.t1c, .plist b.t2c, .plist b.t3c, .plist b.t4c { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 24px; font-weight: 700; }
.note, .small { color: #BFD3D0; }
.foot .small, .foot .note { color: #0A2C39; }
/* zoom in: a real photograph that pulls back and comes into focus */
.zf img.zphoto { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; -webkit-backface-visibility: hidden; backface-visibility: hidden; will-change: transform; }
.zcredit { font-size: 1.7vh; font-weight: 500; color: #BFD3D0; margin-top: 0.8vh; max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zload { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; font-size: 3vh; color: #BFD3D0; }

/* Zoom In with photographs */
.zcol { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: flex-start; align-items: flex-start; }
.zf { width: 99.2vh; height: 62vh; border-width: 0.6vh; }
.zbg { position: absolute; left: -4%; top: -4%; width: 108%; height: 108%; background-size: cover; background-position: center; opacity: 0.45; }
.zi { -webkit-backface-visibility: hidden; backface-visibility: hidden; will-change: transform; }
.zf img.zphoto { will-change: opacity; }
.zload { background: #0A2C39; z-index: 3; text-align: center; }
.zside { width: 28vw; padding-left: 2.6vw; }

/* Know Your Family */
.opts.fam { width: 92vw; }
.opts.fam .opt { width: 43vw; min-height: 13.5vh; font-size: 3.5vh; line-height: 1.15; border-radius: 1.6vh; padding: 1.2vh 1.4vw 1.2vh 1.2vh; }
.opts.fam .opt .ft { -webkit-flex: 1; flex: 1; }
.famlist { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-justify-content: center; justify-content: center; width: 80vw; margin: 2vh 0; }
.famin { background: #7BD389; color: #0A2C39; font-weight: 700; font-size: 3.2vh; border-radius: 1.2vh; padding: 0.8vh 1.6vw; margin: 0.6vh 0.5vw; }
.famwait { color: #BFD3D0; font-size: 3vh; }
.field.fact { border-radius: 16px; font-size: 20px; text-align: left; font-weight: 700; padding: 14px 16px; }
.pbtn.fact { font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.2; text-align: left; padding: 14px 16px; }
.pbtn small { font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 15px; }

/* host phone: big game list */
.big3 { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 26px; color: #F9D648; margin: 18px 0 8px; }
.glist .pbtn.gbig { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; width: 100%; min-height: 68px; margin: 0 0 10px; padding: 12px 18px; background: #EEF3F1; color: #0A2C39; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.05; text-align: left; border-radius: 14px; }
.glist .pbtn.gbig.done { background: #0A2C39; color: #EEF3F1; box-shadow: inset 0 0 0 2px #5BC0EB; }
.glist .pbtn.gbig small { font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 700; color: #F9D648; margin-left: 10px; }
.trow span.tdot { -webkit-flex: none; flex: none; min-width: 36px; text-align: center; }

.half.modes .pbtn { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 24px; min-height: 60px; }
.half.modes .pbtn.wide { width: 100%; }
.pbody h3 { font-size: 20px; }
.prow .pn b { font-size: 19px; } .tdot { font-size: 16px; padding: 9px 11px; }
.sline { font-weight: 700; color: #2E7D4F; } .sline.bad { color: #C0392B; }

/* Avatar host (prototype): a tall video panel at the left; the stage makes room for it */
.avbox { position: absolute; left: 1.4vw; bottom: 17.2vh; width: 25vh; height: 37.5vh; border-radius: 2vh; overflow: hidden; background: #0A2C39; box-shadow: 0 0 0 0.6vh #F9D648, 0 1.2vh 3vh rgba(0, 0, 0, 0.45); z-index: 6; }
.avbox.off, .avbox.down { display: none; }
.avbox video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
.avbox.live video { display: block; }
.avbox .avdemo { position: absolute; left: 6%; right: 6%; top: 10%; bottom: 14%; }
.avbox.live .avdemo { display: none; }
.avbox.talk .hostmouth { -webkit-animation: talk 0.28s infinite; animation: talk 0.28s infinite; -webkit-transform-origin: 117px 110px; transform-origin: 117px 110px; }
.avtag { position: absolute; left: 0; right: 0; bottom: 0; padding: 0.7vh 0.6vh; background: rgba(10, 44, 57, 0.85); color: #F9D648; font-size: 1.7vh; font-weight: 700; text-align: center; }
.avtag:empty { display: none; }
.scr.avmode .stagewrap { padding-left: 29.5vh; }
.scr.avmode .foot .host { visibility: hidden; width: 21vh; }
.scr.avmode .zf { width: 84vh; height: 52.5vh; }
.scr.avmode .zside { width: 24vw; padding-left: 1.8vw; }

/* bigger voting buttons on phones */
.half .pbtn.who { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; min-height: 76px; padding: 14px 8px; margin-bottom: 12px; }
.pbtn.fact { font-size: 24px; line-height: 1.22; padding: 18px 16px; min-height: 84px; }
.pbtn.dark { font-size: 28px; min-height: 76px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; }
.pbtn.o0, .pbtn.o1, .pbtn.o2, .pbtn.o3 { font-size: 32px; min-height: 78px; }
.pbody .q { font-size: 34px; }
</style>

  /* ---------- crillion: the most obscure correct answer wins ---------- */
  function crNorm(t) { return String(t || '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9 ]/g, '').replace(/\b(the|a|an|lake|mount|mt|saint|st)\b/g, ' ').replace(/\s+/g, ' ').replace(/^ | $/g, ''); }

  /* ---------- round 2: the board ---------- */

      put('ptop', m ? '<div class="ptop t' + (S.solo ? 1 : m.t) + '"><span class="pill">' + esc(m.n) + (S.solo ? '' : ', ' + esc(tname(m.t))) + '</span><span class="sc">' + (S.solo ? m.pts + ' pts' : (NT() === 2 ? S.teams[0].score + ' to ' + S.teams[1].score : S.teams[m.t].score + ' &middot; ' + nth(teamRank(m.t)))) + '</span></div>' : '<div class="ptop tn"><span class="sc">Game Show Night</span><span>Room ' + ROOM + '</span></div>');
      // do not redraw a screen with a text box while someone is typing in it
      var wr = S && S.phase === 'scr_q' && S.wr ? (S.wr[pid] || 0) : 0;
      put('pnote', S && ui.failK && ui.failK === S.k ? '<div class="pnote bad">That did not reach the TV. Tap again.</div>' : (wr && !(S.acted && S.acted[pid]) ? '<div class="pnote bad">Not it. Try again. (' + wr + (wr === 1 ? ' try' : ' tries') + ')</div>' : ''));
      var ae = document.activeElement, html = bodyHtml();
      if (ae && ae.tagName === 'INPUT' && cache.pbody && (ae.getAttribute('data-hold') || cache.pbody.replace(/value="[^"]*"/g, '') === html.replace(/value="[^"]*"/g, ''))) { /* keep: someone is typing */ }
      else if (ae && ae.tagName === 'INPUT' && (ae.id === 'nm' || ae.id === 'hk') && !ui.joined && cache.pbody) { /* typing a name: wait */ }
      else if (ae && ae.tagName === 'INPUT' && (ae.id === 'wordin' || ae.id === 'numin' || ae.id === 'crin') && S && cache.pbodyK === S.k && !(S.acted && S.acted[pid]) && !sentHere()) { /* typing an answer: wait */ }
      else { var oldK = cache.pbodyK; if (put('pbody', html)) { cache.pbodyK = S ? S.k : ''; if (cache.pbodyK !== oldK) { cache.pbodyAt = Date.now(); } } }
      var isBoss = S && S.boss === pid && !!m;
      var inGame = S && S.phase !== 'lobby' && S.phase !== 'menu' && S.phase !== 'final';
      var passive = S && /^intro$|_reveal$|^round_end$/.test(S.phase);
      put('pboss', isBoss ? '<div class="bossbar">' + (inGame ? (passive ? '<button data-a="c_next">NEXT</button>' : '<button class="alt wide" data-a="c_next">Skip this one</button>') + '<button class="alt" data-a="c_pause">' + (S.paused ? 'Go' : 'Pause') + '</button>' : '') +
        '<button class="alt' + (inGame ? '' : ' wide') + '" data-a="c_menu">' + (ui.menu ? 'Close' : (inGame ? 'Host' : 'Host controls: players, teams, restart')) + '</button></div>' : '');
      var sheet = '';
      if (isBoss && ui.menu) {
        var tnow = S.now || Date.now(), between = S.phase === 'lobby' || S.phase === 'menu', t;
        var cf = function (a, label) { return '<button class="pbtn plain c' + (ui.confirm === a ? ' warn' : '') + '" data-a="' + a + '">' + (ui.confirm === a ? 'Tap again to confirm' : label) + '</button>'; };
        sheet = '<div class="sheet"><h3>The game</h3>';
        if (inGame) {
          sheet += '<div class="half"><button class="pbtn plain c" data-a="c_pause">' + (S.paused ? 'Resume the game' : 'Pause the game') + '</button><button class="pbtn plain c" data-a="c_skipq">Skip this question</button>' +
            cf('c_restart', 'Restart this game') + '<button class="pbtn plain c" data-a="c_tomenu">Pick a different game</button></div>';
        } else { sheet += '<p class="small">' + (S.phase === 'final' ? 'The night is over. Start a new one below.' : 'Tap a game on the main screen to start it. While a game runs, this is where you pause, skip, restart or switch games.') + '</p>'; }
        if (S.round > 0 && S.phase !== 'final') { sheet += '<button class="pbtn plain c" data-a="c_end">Finish the night and show the winner</button>'; }
        sheet += cf('c_again', 'New night: same players and teams, scores back to zero') + cf('c_reset', 'Start over: everyone joins and picks a team again');
        sheet += '<h3>Players (' + S.order.length + ')</h3>';
        S.order.forEach(function (id) {
          var p = S.players[id]; if (!p) { return; }
          var sig = tnow - p.seen > 10000 ? 'no signal' : (p.rtt ? (p.rtt < 700 ? 'good signal' : (p.rtt < 2000 ? 'slow' : 'very slow')) : 'checking');
          sheet += '<div class="prow"><div class="pn"><b>' + esc(p.n) + '</b>' + (id === pid ? ' (you)' : '') + ' <small>' + p.pts + ' pts &middot; ' + sig + '</small></div><div class="pt">';
          if (!S.solo) { for (t = 0; t < NT(); t++) { sheet += '<button class="tdot tb' + t + (p.t === t ? ' on' : '') + '" data-a="c_move" data-v="' + esc(id) + ',' + t + '">' + esc(tname(t).substring(0, 6)) + '</button>'; } }
          sheet += (id === pid ? '' : '<button class="tdot rm' + (ui.confirm === 'k' + id ? ' on' : '') + '" data-a="c_kick" data-v="' + esc(id) + '">' + (ui.confirm === 'k' + id ? 'Sure?' : 'Remove') + '</button>') + '</div></div>';
        });
        if (S.out) { for (var oid in S.out) { if (S.out.hasOwnProperty(oid)) { sheet += '<div class="prow"><div class="pn"><b>' + esc(S.out[oid]) + '</b> <small>removed</small></div><div class="pt"><button class="tdot" data-a="c_unkick" data-v="' + esc(oid) + '">Let back in</button></div></div>'; } } }
        sheet += between ? modeHtml() : '<h3>Teams</h3><p class="small">The number of teams can change between games. Moving a player works any time.</p>';
        if (!S.solo) {
          sheet += '<h3>Team names and scores</h3>';
          for (t = 0; t < NT(); t++) { sheet += '<div class="trow"><input class="field sm" id="tn' + t + '" maxlength="14" value="' + esc(tname(t)) + '"><button class="tdot" data-a="c_adj" data-v="' + t + ',-50">-50</button><b>' + S.teams[t].score + '</b><button class="tdot" data-a="c_adj" data-v="' + t + ',50">+50</button></div>'; }
          sheet += '<div class="half"><button class="pbtn plain c" data-a="c_names">Save team names</button>' + (NT() === 2 ? '<button class="pbtn plain c" data-a="c_preset">Kids vs Adults</button>' : '') + '</div>';
        }
        sheet += '<button class="pbtn plain c' + (S.short ? ' sel' : '') + '" data-a="c_short">Short games: ' + (S.short ? 'on' : 'off') + '</button>' + (between ? '' : '<p class="small">Short games take effect from the next game.</p>');
        sheet += '<button class="pbtn dark" data-a="c_menu">Close</button></div>';
      }
      var ae2 = document.activeElement;
      if (ae2 && ae2.tagName === 'INPUT' && /^tn\d$/.test(ae2.id) && sheet) { /* typing a team name: do not redraw */ } else {
      put('psheet', sheet); }
      tickUI();
    }
    var GUARD = { ans: 1, vote: 1, mlv: 1, fpick: 1, tile: 1, c_next: 1, c_crj: 1, famv: 1 };
    var CONFIRM = { c_restart: 1, c_again: 1, c_reset: 1, c_kick: 1 };
    function onAct(b) {
      var a = b.getAttribute('data-a'), v = b.getAttribute('data-v'), el;
      if (CONFIRM[a]) { var ck = a === 'c_kick' ? 'k' + v : a; if (ui.confirm !== ck) { ui.confirm = ck; render(); return; } }
      ui.confirm = '';
      // A choice that shows up under a finger that was already tapping does not count: half a second of grace.
      if (GUARD[a] && Date.now() - (cache.pbodyAt || 0) < 550) { return; }
      if (a === 'team') { el = document.getElementById('nm'); if (el) { ui.name = el.value; } ui.team = +v; cache.pbody = null; put('pbody', bodyHtml()); return; }
      if (a === 'join') {
        el = document.getElementById('nm'); var name = (el ? el.value : ui.name).replace(/[<>]/g, '').replace(/^\s+|\s+$/g, '').substring(0, 14);
        if (!name) { if (el) { el.focus(); } return; }
        if (!S) { return; }
        var hkEl = document.getElementById('hk'); if (hkEl && hkEl.value) { ui.h = hkEl.value.toLowerCase().replace(/[^a-z0-9]/g, ''); lsSet('gn_h_' + ROOM, ui.h); }
        if (ui.team < 0 || ui.team >= NT()) { if (S.solo) { ui.team = 0; } else { return; } }
        ui.name = name; ui.joined = true; ui.ep = S.epoch; lsSet('rc_name', name); lsSet('rc_room', ROOM); lsSet('rc_team', String(ui.team)); lsSet('gn_ep', String(ui.ep));
        wakeLock();
        if (el) { el.blur(); }
        hello();
      }
      else if (a === 'switch') { ui.team = +v; lsSet('rc_team', String(ui.team)); send({ t: 'team', team: ui.team }); }
      else if (a === 'reload') { try { location.reload(true); } catch (e) { location.href = location.href; } return; }
      else if (!S) { return; }
      else if (a === 'vote') { doAct({ t: 'vote', a: +v }, S.q.kind === 'mix' ? 'ABCD'.charAt(+v) : S.q.o[+v]); }
      else if (a === 'mlv') { doAct({ t: 'mlv', v: v }, 'Voted'); }
      else if (a === 'num') { el = document.getElementById('numin'); if (!el || el.value === '' || isNaN(parseFloat(el.value))) { if (el) { el.focus(); } return; } var nval = parseFloat(el.value); el.blur(); doAct({ t: 'num', v: nval }, String(nval)); }
      else if (a === 'word') { el = document.getElementById('wordin'); if (!el || !el.value) { if (el) { el.focus(); } return; } send({ t: 'word', k: S.k, n: 1, text: el.value }); el.value = ''; return; }
      else if (a === 'c_play') { ctl('play', { key: v }); try { window.scrollTo(0, 0); } catch (e) { } }
      else if (a === 'c_short') { ctl('short', { on: !S.short }); }
      else if (a === 'c_solo') { ctl('solo', { on: v === '1' }); }
      else if (a === 'c_nteams') { ctl('nteams', { n: +v }); }
      else if (a === 'c_shuffle') { ctl('shuffle'); }
      else if (a === 'c_move') { var mv = v.split(','); ctl('move', { p: mv[0], t: +mv[1] }); }
      else if (a === 'c_kick') { ctl('kick', { p: v }); }
      else if (a === 'c_unkick') { ctl('unkick', { p: v }); }
      else if (a === 'c_restart') { ctl('restart'); ui.menu = false; }
      else if (a === 'c_reset') { ctl('reset'); ui.menu = false; }
      else if (a === 'c_skipq') { ctl('next', { k: S.k }); ui.menu = false; }
      else if (a === 'c_crj') { var cj = v.split(','); ctl('crj', { p: cj[0], ok: cj[1] === '1', said: 5, by: 'the host' }); }
      else if (a === 'fam') { el = document.getElementById('famin'); if (!el || el.value.replace(/[^A-Za-z0-9]/g, '').length < 6) { if (el) { el.focus(); } return; } var ftxt = el.value; el.blur(); doAct({ t: 'fam', text: ftxt, kid: v === '1' ? 1 : 0 }, ''); }
      else if (a === 'famv') { doAct({ t: 'famv', a: +v }, 'ABCD'.charAt(+v)); }
      else if (a === 'cr') { el = document.getElementById('crin'); if (!el || !el.value.replace(/\s/g, '')) { if (el) { el.focus(); } return; } var ctxt = el.value; el.blur(); doAct({ t: 'cr', text: ctxt }, ctxt); }
      else if (a === 'c_tomenu') { ctl('menu'); ui.menu = false; }
      else if (a === 'tile') { var cl = v.split(','); doAct({ t: 'pick', c: +cl[0], l: +cl[1] }, 'Picked'); }
      else if (a === 'buzz') {
        if (sentHere()) { return; }
        try { if (navigator.vibrate) { navigator.vibrate(60); } } catch (e) { }
        if (S.phase === 'phrase_turn') { doAct({ t: 'buzz' }, 'Buzzed'); }
        else { var bdt = hnow() - (S.openAt || 0); if (bdt < 0) { if (ui.earlyUntil && Date.now() < ui.earlyUntil) { return; } ui.earlyUntil = Date.now() + 2500; send({ t: 'buzz', early: 1, k: S.k, n: 0 }); render(); setTimeout(render, 2600); } else { doAct({ t: 'buzz', dt: Math.round(bdt) }, 'Buzzed'); } }   // a tap before GO is sent too: it costs points
      }
      else if (a === 'ans') { doAct({ t: 'ans', a: +v }, S.phase === 'board_q' && S.q && S.q.o ? S.q.o[+v] : 'Answer sent'); }
      else if (a === 'letter') { doAct({ t: 'letter', l: v }, v); }
      else if (a === 'solve') { el = document.getElementById('solve'); if (!el || !el.value) { return; } var txt = el.value; el.blur(); doAct({ t: 'solve', text: txt }, 'Sent'); }
      else if (a === 'fpick') { doAct({ t: 'fpick', o: +v }, 'Answer sent'); }
      else if (a === 'c_next') { ctl('next', { k: S.k }); }
      else if (a === 'c_pause') { ctl('pause'); }
      else if (a === 'c_menu') { ui.menu = !ui.menu; }
      else if (a === 'c_end') { ctl('end'); ui.menu = false; }
      else if (a === 'c_again') { ctl('again'); ui.menu = false; }
      else if (a === 'c_adj') { var ad = v.split(','); ctl('adj', { team: +ad[0], d: +ad[1] }); }
      else if (a === 'c_names') { var nms = []; for (var ti = 0; ti < NT(); ti++) { var te = document.getElementById('tn' + ti); if (te) { te.blur(); nms.push(te.value); } else { nms.push(tname(ti)); } } ctl('teams', { names: nms }); }
      else if (a === 'c_lnames') { var lnm = []; for (var li2 = 0; li2 < NT(); li2++) { var le = document.getElementById('ln' + li2); if (le) { le.blur(); lnm.push(le.value); } else { lnm.push(tname(li2)); } } ctl('teams', { names: lnm }); }
      else if (a === 'c_preset') { ctl('teams', { names: ['Kids', 'Adults'] }); }
      render();
    }
    var lastTouch = 0;
    app.addEventListener('touchstart', function (e) { var b = closest(e.target, 'data-a'); if (b && b.getAttribute('data-a') === 'buzz' && !b.disabled) { lastTouch = Date.now(); onAct(b); } });
    app.addEventListener('click', function (e) {
      var b = closest(e.target, 'data-a'); if (!b || b.disabled) { return; }
      if (b.getAttribute('data-a') === 'buzz' && Date.now() - lastTouch < 700) { return; }
      onAct(b);
    });
    render();
  }

  if (ROLE === 'screen') { screen(); } else if (ROLE === 'play') { phone(); } else { home(); }
})();

</script>
