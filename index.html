<style>
/* Rain Check! "Studio 74" look: a 1970s game-show set.
   Cocoa #3A2214, orange #C4520F (team 1), teal #17696B (team 2), mustard #F2B705, cream #FBF0D9.
   Flexbox only, no grid and no CSS variables, so older TV browsers can draw it. */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #FBF0D9; color: #3A2214; font-family: 'Nunito', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; -webkit-text-size-adjust: 100%; }
button, input { font-family: inherit; }
button { touch-action: manipulation; cursor: pointer; }
.hide { display: none !important; }
/* the fat display face */
.home h1, .big, .tm .ts, .logo, .joinbox b, .overlay h1, .overlay button, .paused, .h1, .h2, .status.go, .lobby .qr .code, .lobby .col h3, .opt .l, .opt .n, .bcell, .clue, .answer, .zval, .slot .no, .slot .pt, .strikes b, .pot, .bigx, .bar .bf, .ptop .sc, .pbody h2, .watch, .pbtn.go, .buzz, .tiles button, .bossbar button { font-family: 'Bagel Fat One', 'Nunito', sans-serif; font-weight: 400; }

/* ---------- home ---------- */
.home { max-width: 560px; margin: 0 auto; padding: 28px 20px; text-align: center; }
.home h1 { font-size: 52px; margin: 10px 0 4px; color: #C4520F; line-height: 1; }
.home p { font-size: 18px; font-weight: 800; }
.big { display: block; width: 100%; border: 0; border-radius: 999px; padding: 20px 16px; margin: 16px 0; font-size: 24px; color: #FFFFFF; background: #17696B; box-shadow: 0 7px 0 #3A2214; }
.big.red { background: #C4520F; }
.big:focus { outline: 5px solid #F2B705; }
.field { width: 100%; font-size: 24px; padding: 16px 22px; border: 4px solid #3A2214; border-radius: 999px; background: #FFFFFF; color: #3A2214; text-align: center; font-weight: 800; }
.note { font-size: 15px; margin-top: 22px; }

/* ---------- TV screen ---------- */
.scr { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; background: #3A2214; color: #3A2214; }
.rays { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.top { position: relative; height: 12vh; -webkit-flex: none; flex: none; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 1.4vh 2.4vw 0; }
.tm { width: 27vw; height: 9.4vh; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; padding: 0 0.8vh 0 2vw; color: #FFFFFF; border-radius: 99vh; border: 0.7vh solid #FBF0D9; }
.tm.t0 { background: #C4520F; }

.tm.ctrl { border-color: #F2B705; }
.mid { -webkit-flex: 1; flex: 1; text-align: center; }
.logo { font-size: 6.6vh; line-height: 1; color: #F2B705; }
.sub { font-size: 2.6vh; color: #FBF0D9; font-weight: 800; margin-top: 0.4vh; }
.stagewrap { position: relative; -webkit-flex: 1; flex: 1; padding: 1.2vh 4vw 1.6vh; display: -webkit-flex; display: flex; min-height: 0; }
.frame { -webkit-flex: 1; flex: 1; background: #F2B705; border-radius: 4.4vh; padding: 0 2vh; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; min-height: 0; }
.bulbs { height: 3.2vh; -webkit-flex: none; flex: none; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; padding: 0 2.4vw; }

.stage { -webkit-flex: 1; flex: 1; min-height: 0; position: relative; overflow: hidden; background: #FBF0D9; border-radius: 2.8vh; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; padding: 1vh 2vw; text-align: center; }
.stripes { position: relative; -webkit-flex: none; flex: none; }

.stripes .s0 { background: #C4520F; } .stripes .s1 { background: #F2B705; } .stripes .s2 { background: #17696B; }
.foot { position: relative; height: 16vh; -webkit-flex: none; flex: none; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; background: #FBF0D9; padding: 0 2.4vw; }

.bubble { -webkit-flex: 1; flex: 1; margin: 0 2vw; font-size: 3.5vh; font-weight: 800; line-height: 1.22; max-height: 13.5vh; overflow: hidden; text-align: left; }

.menubtn { position: absolute; right: 0.6vw; top: 13vh; font-size: 2.2vh; font-weight: 800; background: #FBF0D9; color: #3A2214; border: 0; border-radius: 99vh; padding: 0.7vh 1.6vh; opacity: 0.5; z-index: 5; }
.menubtn:focus { opacity: 1; outline: 0.5vh solid #F2B705; }

.status.go { display: inline-block; background: #C4520F; color: #FFFFFF; border-radius: 99vh; padding: 1vh 4vh 1.3vh; -webkit-animation: pulse 0.7s infinite; animation: pulse 0.7s infinite; }
.status.go span { color: #FFFFFF; }
.t0c { color: #C4520F; } .t1c { color: #17696B; }
.timer { -webkit-flex: none; flex: none; width: 56vw; height: 1.8vh; background: #3A2214; border-radius: 1vh; overflow: hidden; margin-top: 1.6vh; padding: 0.4vh; }
.timer i { display: block; height: 100%; width: 100%; background: #F2B705; border-radius: 1vh; }
.lineup { font-size: 2.5vh; font-weight: 800; margin-top: 0.8vh; }
.lineup b { color: #C4520F; font-weight: 900; }
.tally { font-size: 3.4vh; font-weight: 800; margin-top: 1vh; }

/* lobby */
.lobby { display: -webkit-flex; display: flex; width: 100%; -webkit-flex: 1; flex: 1; min-height: 0; -webkit-align-items: center; align-items: center; }

.chip { font-size: 3.2vh; font-weight: 800; padding: 0.4vh 1vh; line-height: 1.15; }
.chip small { font-size: 2vh; white-space: nowrap; color: #17696B; font-weight: 900; }

/* options (vote) */

.opt .n { margin-left: auto; padding-left: 1vw; }
.o0 { background: #C4520F; } .o1 { background: #17696B; } .o2 { background: #F2B705; color: #3A2214; } .o3 { background: #3A2214; }
.opt.dim { opacity: 0.25; }
.opt.win { box-shadow: 0 0 0 0.7vh #FBF0D9, 0 0 0 1.5vh #3A2214; }

/* board */
.board { display: -webkit-flex; display: flex; width: 86vw; height: 45vh; }
.bcol { -webkit-flex: 1; flex: 1; margin: 0 0.5vw; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
.bhead { height: 9vh; background: #17696B; color: #FFFFFF; font-size: 2.8vh; font-weight: 900; border-radius: 2vh; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; padding: 0 0.5vw; line-height: 1.1; }
.bcell { -webkit-flex: 1; flex: 1; margin-top: 1vh; background: #FFFFFF; border: 0.5vh solid #3A2214; border-radius: 99vh; font-size: 5vh; color: #C4520F; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }

/* zoom */
.zwrap { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }

.zi { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

.zside { width: 30vw; padding-left: 3vw; text-align: left; }
.zval { font-size: 12vh; color: #C4520F; line-height: 1; }

/* phrase and word tiles */
.phrase { max-width: 84vw; }
.word { display: inline-block; white-space: nowrap; margin: 0.7vh 1.4vw; }
.lt { font-weight: 900; display: inline-block; width: 6vh; height: 8vh; line-height: 8vh; margin: 0 0.3vh; background: #FFFFFF; border: 0.5vh solid #3A2214; border-radius: 1.4vh; font-size: 5.6vh; text-align: center; vertical-align: top; }

.used { font-size: 3.2vh; font-weight: 800; letter-spacing: 0.6vh; margin-top: 1.2vh; }

.miss i { display: inline-block; width: 4.6vh; height: 4.6vh; line-height: 3.8vh; border-radius: 50%; border: 0.5vh solid #3A2214; margin: 0 0.4vh; font-style: normal; color: #FFFFFF; vertical-align: middle; }
.miss i.x { background: #C4520F; border-color: #C4520F; }

/* survey says */
.fwrap { display: -webkit-flex; display: flex; width: 84vw; -webkit-align-items: center; align-items: center; }
.slots { -webkit-flex: 1; flex: 1; }
.slot { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; height: 6.6vh; margin: 0.7vh 0; border-radius: 99vh; background: #3A2214; color: #FBF0D9; font-size: 3.8vh; font-weight: 900; padding: 0 2vw 0 0.8vh; text-align: left; }
.slot .no { -webkit-flex: none; flex: none; width: 5vh; height: 5vh; line-height: 5vh; text-align: center; border-radius: 50%; background: #F2B705; color: #3A2214; margin-right: 1.2vw; }
.slot .pt { margin-left: auto; color: #C4520F; }
.slot.shown { background: #FFFFFF; color: #3A2214; box-shadow: inset 0 0 0 0.5vh #3A2214; }
.slot.shown.missed { opacity: 0.55; }

.fside { width: 24vw; padding-left: 2vw; }

.bigx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; font-size: 46vh; color: #C4520F; -webkit-animation: flash 1.1s forwards; animation: flash 1.1s forwards; pointer-events: none; z-index: 7; }

/* scores */

/* host */

.talk .hostmouth { -webkit-animation: talk 0.28s infinite; animation: talk 0.28s infinite; -webkit-transform-origin: 117px 110px; transform-origin: 117px 110px; }
@-webkit-keyframes bob { 0%,100% { -webkit-transform: translateY(0); } 50% { -webkit-transform: translateY(-4px); } }

@keyframes talk { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.25); } }
@-webkit-keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
@-webkit-keyframes flash { 0% { opacity: 0; -webkit-transform: scale(0.4); } 20% { opacity: 1; -webkit-transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
@keyframes flash { 0% { opacity: 0; transform: scale(0.4); } 20% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
@-webkit-keyframes fall { 0% { -webkit-transform: translateY(0) rotate(0deg); } 100% { -webkit-transform: translateY(80vh) rotate(540deg); } }
@keyframes fall { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(80vh) rotate(540deg); } }

/* ---------- phone ---------- */
.ph { max-width: 560px; margin: 0 auto; min-height: 100%; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; background: #FBF0D9; }

.tiles button[disabled] { color: #FBF0D9; background: #FBF0D9; border-color: #E8DCC0; }
.keys { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-justify-content: center; justify-content: center; margin: 8px 0 18px; }
.keys button { font-weight: 900; width: 13.2%; margin: 0.55%; height: 54px; border: 3px solid #3A2214; border-radius: 12px; background: #FFFFFF; font-size: 22px; color: #3A2214; padding: 0; }
.keys button[disabled] { opacity: 0.22; }
.pmask { font-weight: 900; font-size: 22px; letter-spacing: 3px; word-spacing: 10px; margin: 8px 0; line-height: 1.5; }
.pmask.big2 { font-size: 34px; letter-spacing: 6px; color: #17696B; }
.bossbar { position: fixed; left: 0; bottom: 0; width: 100%; background: #3A2214; padding: 10px 8px; display: -webkit-flex; display: flex; z-index: 9; }
.bossbar button { -webkit-flex: 1; flex: 1; margin: 0 4px; border: 0; border-radius: 999px; padding: 14px 6px; font-size: 20px; background: #F2B705; color: #3A2214; min-height: 54px; }
.bossbar button.alt { background: #FBF0D9; -webkit-flex: none; flex: none; width: 84px; font-family: inherit; font-weight: 900; font-size: 17px; }
.sheet { position: fixed; left: 0; bottom: 78px; width: 100%; background: #FBF0D9; border-top: 5px solid #3A2214; padding: 12px 14px; z-index: 8; max-height: 70%; overflow: auto; }
.sheet .r2 { display: -webkit-flex; display: flex; } .sheet .r2 button { -webkit-flex: 1; flex: 1; margin: 4px; }
.banner { background: #F2B705; color: #3A2214; font-weight: 900; font-size: 16px; padding: 8px 12px; text-align: center; }
.plist { text-align: left; font-size: 18px; font-weight: 800; margin: 6px 0 14px; }
.plist b.t0c, .plist b.t1c { display: block; margin-top: 10px; font-size: 20px; font-weight: 900; }
.small { font-size: 15px; font-weight: 800; }

/* game menu */
.gmenu { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-justify-content: center; justify-content: center; width: 86vw; }
.gtile { width: 13.2vw; height: 12vh; margin: 0.7vh 0.45vw; border: 0; border-radius: 2.6vh; background: #17696B; color: #FFFFFF; font-size: 2.7vh; font-weight: 900; line-height: 1.1; padding: 0 0.5vw; box-shadow: 0 0.9vh 0 #3A2214; }
.gtile:focus { outline: 0.7vh solid #F2B705; }
.gtile.done { background: #FFFFFF; color: #3A2214; box-shadow: inset 0 0 0 0.5vh #3A2214; }
.gtile small { display: block; font-size: 2vh; color: #C4520F; margin-top: 0.4vh; }
.pbtn.game { background: #17696B; }
.half .pbtn.game { min-height: 76px; font-size: 18px; }
.pbtn.game.done { background: #FFFFFF; color: #3A2214; box-shadow: inset 0 0 0 3px #3A2214; }
.pbtn.game small { display: block; font-size: 13px; color: #C4520F; }
.bossbar button.alt.wide { -webkit-flex: 1; flex: 1; width: auto; }
button.banner { display: block; width: 100%; border: 0; }

/* player standings */
.ranks { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-justify-content: center; justify-content: center; width: 84vw; margin-top: 0.6vh; }
.rk { width: 26vw; margin: 0.45vh 0.6vw; height: 5.2vh; border-radius: 99vh; background: #FFFFFF; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 0 1.4vw 0 0.5vh; font-size: 3vh; font-weight: 900; text-align: left; }
.rk b { -webkit-flex: none; flex: none; width: 4.2vh; height: 4.2vh; line-height: 4.2vh; border-radius: 50%; background: #F2B705; text-align: center; font-size: 2.4vh; margin-right: 1vw; }
.rk span { -webkit-flex: 1; flex: 1; white-space: nowrap; overflow: hidden; }
.rk i { font-style: normal; font-family: 'Bagel Fat One', 'Nunito', sans-serif; font-weight: 400; }
/* crillion */
.crl { width: 84vw; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-justify-content: center; justify-content: center; }
.crr { width: 70vw; height: 6.2vh; margin: 0.5vh 0.6vw; border-radius: 99vh; background: #FFFFFF; box-shadow: inset 0 0 0 0.4vh #3A2214; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 0 1.6vw; font-size: 3.2vh; font-weight: 900; text-align: left; }
.crl.two .crr { width: 40vw; height: 5.4vh; font-size: 2.7vh; }
.crr span { -webkit-flex: none; flex: none; width: 32%; white-space: nowrap; overflow: hidden; }
.crr b { -webkit-flex: 1; flex: 1; white-space: nowrap; overflow: hidden; }
.crr small { font-size: 2.1vh; font-weight: 800; margin-right: 1vw; white-space: nowrap; }
.crr i { font-style: normal; font-family: 'Bagel Fat One', 'Nunito', sans-serif; font-weight: 400; color: #17696B; }
.crr i.bad, .crr i.ask { color: #C4520F; }
.crr i.bad { font-family: 'Nunito', sans-serif; font-weight: 900; }
.crr small { max-width: 46%; overflow: hidden; }
.crr.out { opacity: 0.55; }

.crr b em { font-style: normal; font-weight: 800; font-size: 0.8em; opacity: 0.7; }
.gap { height: 28px; }
</style>

        var b0 = bin.read();

        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

        throw count + ' != ' + numChars;
      }

      return unicodeMap;

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

              bytes.push(b & 0xff);

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function range(n) { var a = []; for (var i = 0; i < n; i++) { a.push(i); } return a; }
  function pickOne(a) { return a[Math.floor(rnd() * a.length)]; }
  function line(key) { return pickOne(C.lines[key]); }
  function clean(s, n) { s = String(s == null ? '' : s).replace(/[\u0000-\u001f<>]/g, '').replace(/\s+/g, ' ').replace(/^ | $/g, ''); return s.substring(0, n); }
  function mc(item) { // shuffle options, remember where the right one landed
    var order = shuffle(range(item.o.length));
    var o = []; var a = 0;
    for (var i = 0; i < order.length; i++) { o.push(item.o[order[i]]); if (order[i] === 0) { a = i; } }
    return { q: item.q, o: o, a: a, f: item.f || '' };
  }
  var CAT = {};
  for (var ci = 0; ci < C.rounds.length; ci++) { CAT[C.rounds[ci].key] = C.rounds[ci]; }
  function cnt(full, small) { return S.short ? small : full; }
  function fmt(n, plain) { var t = String(n); if (plain) { return t; } return t.replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function readMs(text) { return Math.min(9000, 1800 + String(text).length * 55); }

  function say(text) { S.say = { id: S.say.id + 1, text: text }; }
  function fx(name) { S.fx = { id: S.fx.id + 1, name: name }; }
  function setPhase(phase, now, dur) {
    kc++;
    S.phase = phase; S.k = phase + ':' + kc; S.acted = {}; S.t0 = now;
    S.deadline = dur ? now + dur : 0;
  }
  function pl(pid) { return S.players[pid]; }
  function present(pid, now) { var p = pl(pid); return !!p && (now - p.seen) < PRESENT_MS; }
  function teamList(t, now) { var out = []; for (var i = 0; i < S.order.length; i++) { var p = pl(S.order[i]); if (p && p.t === t && present(S.order[i], now)) { out.push(S.order[i]); } } return out; }
  function teamPresent(t, now) { return teamList(t, now).length > 0; }
  function nextPlayer(t, now) {
    var list = teamList(t, now);
    if (!list.length) { return null; }
    S.rot[t] = (S.rot[t] + 1) % list.length;
    return list[S.rot[t]];
  }
  function nextAll(now) { // every player for themselves: rotate through everyone who is here
    var list = [];
    for (var i = 0; i < S.order.length; i++) { if (present(S.order[i], now)) { list.push(S.order[i]); } }
    if (!list.length) { return null; }
    S.rotA = ((S.rotA || 0) + 1) % list.length;
    return list[S.rotA];
  }
  function nextPlayerAny(t, now) { if (S.solo) { return nextAll(now); } var p = nextPlayer(t, now); if (p) { return p; } return nextPlayer(1 - t, now); }
  /* A "side" is whoever shares a lockout: a team in team play, one player in solo play. */
  function side(pid) { var p = pl(pid); if (!p) { return 'x'; } return S.solo ? pid : p.t; }
  function othersLeft(lockMap, now) { for (var i = 0; i < S.order.length; i++) { if (present(S.order[i], now) && !lockMap[side(S.order[i])]) { return true; } } return false; }
  function award(team, pts, pid) {
    if (pid && pl(pid)) { pl(pid).pts += pts; }
    if (S.solo || (team !== 0 && team !== 1)) { return; }
    S.teams[team].score += pts;
    S.gain = { id: (S.gain ? S.gain.id : 0) + 1, team: team, pts: pts };
  }
  function ranking() { // players, best first
    var out = [];
    for (var i = 0; i < S.order.length; i++) { var p = pl(S.order[i]); if (p) { out.push({ p: S.order[i], n: p.n, pts: p.pts, t: p.t }); } }
    out.sort(function (x, y) { return y.pts - x.pts; });
    return out;
  }
  function nm(pid) { return pid && pl(pid) ? pl(pid).n : 'Nobody'; }
  function trailing() { if (S.teams[0].score === S.teams[1].score) { return rnd() < 0.5 ? 0 : 1; } return S.teams[0].score < S.teams[1].score ? 0 : 1; }
  function activeTeam(t, now) { return teamPresent(t, now) ? t : (teamPresent(1 - t, now) ? 1 - t : t); }

  function init(room, now) {
    kc = 0;
    S = {
      v: 4, room: room, boot: Math.floor(rnd() * 1e9), phase: 'lobby', k: 'lobby:0', paused: false, pleft: 0,
      teams: [{ name: 'Thunder', score: 0 }, { name: 'Lightning', score: 0 }],
      players: {}, order: [], boss: null, round: 0, rot: [-1, -1],
      say: { id: 0, text: '' }, fx: { id: 0, name: '' }, gain: null,
      acted: {}, deadline: 0, turn: null,
      short: false, solo: false, played: {}, cur: ''
    };
    P = {};
    return S;
  }

  /* ---------- round flow ---------- */
  function goMenu(now) {
    S.turn = null; S.cur = '';
    setPhase('menu', now, 0);
    say(S.round ? 'Showrunner, pick the next game.' : 'Showrunner, pick the first game.');
  }
  function startGame(key, now) {
    var info = CAT[key];
    if (!info) { return; }
    var first = S.round === 0;
    S.round++; S.cur = key; S.played[key] = (S.played[key] || 0) + 1;
    S.intro = { n: S.round, title: info.title, how: info.how };
    S.rt = info.title;
    S.turn = null; S.rv = null;
    setPhase('intro', now, 12000);
    say((first ? line('welcome') + ' ' : '') + info.title + '. ' + info.how.join(' '));
    fx('fanfare');
  }
  function beginRound(now) {
    var key = S.cur;
    if (key === 'vote') { P.vq = shuffle(C.votes).slice(0, cnt(8, 5)); P.vkind = 'mix'; S.vi = -1; nextVote(now); }
    else if (key === 'tf') { P.vq = shuffle(C.tf).slice(0, cnt(10, 6)); P.vkind = 'tf'; S.vi = -1; nextVote(now); }
    else if (key === 'decade') { P.vq = shuffle(C.decades).slice(0, cnt(8, 5)); P.vkind = 'decade'; S.vi = -1; nextVote(now); }
    else if (key === 'likely') { P.mq = shuffle(C.likely).slice(0, cnt(6, 4)); S.mi = -1; nextLikely(now); }
    else if (key === 'num') { P.nq = shuffle(C.numbers).slice(0, cnt(6, 4)); S.ni = -1; nextNum(now); }
    else if (key === 'scramble') { P.wq = shuffle(C.words).slice(0, cnt(6, 4)); S.wi = -1; nextWord(now); }
    else if (key === 'board') { setupBoard(now); boardPick(now); }
    else if (key === 'zoom') { P.zs = shuffle(C.zoom).slice(0, cnt(5, 3)); S.zi = -1; nextZoom(now); }
    else if (key === 'phrase') { P.ps = shuffle(C.phrases).slice(0, cnt(4, 2)); S.pi = -1; S.pteam = trailing(); nextPhrase(now); }
    else if (key === 'feud') { setupFeud(); S.fi = -1; nextFeud(now); }
    else if (key === 'crillion') { P.cq = shuffle(C.crillion).slice(0, cnt(5, 3)); S.ci = -1; nextCr(now); }
  }
  function roundEnd(now) {
    S.turn = null;
    S.re = { n: S.round, title: S.rt };
    setPhase('round_end', now, 10000);
    var a = S.teams[0], b = S.teams[1], rk = ranking();
    if (S.solo) { say(rk.length ? rk[0].n + ' is in front with ' + rk[0].pts + ' points.' : 'No points yet.'); }
    else { say(a.score === b.score ? 'It is all tied up at ' + a.score + '!' : (a.score > b.score ? a.name : b.name) + ' lead, ' + Math.max(a.score, b.score) + ' to ' + Math.min(a.score, b.score) + '.'); }
    fx('fanfare');
  }
  function finale(now) {
    var a = S.teams[0].score, b = S.teams[1].score;
    var best = null, king = null;
    for (var i = 0; i < S.order.length; i++) {
      var p = pl(S.order[i]); if (!p) { continue; }
      if (!best || p.pts > best.pts) { best = p; }
      if (!king || p.bz > king.bz) { king = p; }
    }
    var rk = ranking();
    S.fin = { solo: !!S.solo, winner: a === b ? -1 : (a > b ? 0 : 1), mvp: best ? best.n : '', mvpPts: best ? best.pts : 0, king: king && king.bz ? king.n : '', kingN: king ? king.bz : 0,
      champ: rk.length ? rk[0].n : '', tie: rk.length > 1 && rk[0].pts === rk[1].pts };
    S.turn = null;
    setPhase('final', now, 0);
    if (S.solo) { say((S.fin.tie ? 'It is a tie at the top! ' : S.fin.champ + ' wins! ') + line('final')); }
    else { say((S.fin.winner < 0 ? 'It is a tie! ' : S.teams[S.fin.winner].name + ' win! ') + line('final')); }
    fx('win');
  }

  /* ---------- round 1: everybody votes ---------- */
  function nextVote(now) {
    S.vi++;
    if (S.vi >= P.vq.length) { return roundEnd(now); }
    var it = P.vq[S.vi];
    if (P.vkind === 'tf') { P.cur = { q: it.q, o: ['True', 'False'], a: it.a ? 0 : 1, f: it.f || '' }; }
    else if (P.vkind === 'decade') { var so = it.o.slice().sort(); P.cur = { q: it.q, o: so, a: so.indexOf(it.o[0]), f: '' }; }
    else { P.cur = mc(it); }
    P.votes = {};
    S.q = { n: S.vi + 1, of: P.vq.length, text: P.cur.q, o: P.cur.o, kind: P.vkind };
    S.nv = 0; S.rv = null;
    setPhase('vote_q', now, readMs(P.cur.q) + (P.vkind === 'tf' ? 12000 : 20000));
    say((P.vkind === 'tf' ? 'True or false? ' : (P.vkind === 'decade' ? 'Which decade? ' : '')) + P.cur.q);
  }
  function endVote(now) {
    var counts = [], ok = [0, 0], den = [0, 0], fast = null, pid, v;
    for (var ci2 = 0; ci2 < P.cur.o.length; ci2++) { counts.push(0); }
    for (var i = 0; i < S.order.length; i++) {
      pid = S.order[i]; v = P.votes[pid];
      var p = pl(pid); if (!p) { continue; }
      if (v || present(pid, now)) { den[p.t]++; }
      if (v) {
        counts[v.a]++;
        if (v.a === P.cur.a) { ok[p.t]++; p.pts += 100; if (!fast || v.at < P.votes[fast].at) { fast = pid; } }
      }
    }
    var gains = [0, 0];
    for (var t = 0; t < 2; t++) { gains[t] = den[t] ? Math.round(100 * ok[t] / den[t]) : 0; }
    if (fast) { gains[pl(fast).t] += 20; pl(fast).pts += 20; }
    if (!S.solo) { S.teams[0].score += gains[0]; S.teams[1].score += gains[1]; }
    S.rv = { a: P.cur.a, counts: counts, gains: gains, nok: ok[0] + ok[1], fast: fast ? pl(fast).n : '', fact: P.cur.f };
    setPhase('vote_reveal', now, 9000);
    say('The answer is ' + P.cur.o[P.cur.a] + '. ' + (P.cur.f || ''));
    fx(ok[0] + ok[1] > 0 ? 'right' : 'wrong');
  }

  /* ---------- most likely to ---------- */
  function allActed(now) { for (var i = 0; i < S.order.length; i++) { if (present(S.order[i], now) && !S.acted[S.order[i]]) { return false; } } return true; }
  function nextLikely(now) {
    S.mi++;
    if (S.mi >= P.mq.length) { return roundEnd(now); }
    var who = [];
    for (var i = 0; i < S.order.length && who.length < 16; i++) { if (present(S.order[i], now)) { who.push({ p: S.order[i], n: nm(S.order[i]) }); } }
    S.ml = { n: S.mi + 1, of: P.mq.length, text: 'Who is most likely to ' + P.mq[S.mi] + '?', who: who };
    P.mv = {}; S.nv = 0; S.rv = null;
    setPhase('ml_q', now, readMs(S.ml.text) + 22000);
    say(S.ml.text);
  }
  function endLikely(now) {
    var tally = {}, max = 0, pid, i;
    for (pid in P.mv) { if (P.mv.hasOwnProperty(pid)) { tally[P.mv[pid]] = (tally[P.mv[pid]] || 0) + 1; if (tally[P.mv[pid]] > max) { max = tally[P.mv[pid]]; } } }
    var top = [], win = [];
    for (i = 0; i < S.ml.who.length; i++) { var w = S.ml.who[i]; if (tally[w.p]) { top.push({ n: w.n, c: tally[w.p] }); if (tally[w.p] === max) { win.push(w.n); } } }
    top.sort(function (x, y) { return y.c - x.c; });
    var ok = [0, 0], den = [0, 0], gains = [0, 0];
    for (i = 0; i < S.order.length; i++) {
      pid = S.order[i]; var p = pl(pid); if (!p) { continue; }
      if (P.mv[pid] || present(pid, now)) { den[p.t]++; }
      if (P.mv[pid] && tally[P.mv[pid]] === max) { ok[p.t]++; p.pts += 100; }
    }
    for (var t = 0; t < 2; t++) { gains[t] = den[t] ? Math.round(100 * ok[t] / den[t]) : 0; if (!S.solo) { S.teams[t].score += gains[t]; } }
    S.rv = { win: win, top: top.slice(0, 4), gains: gains, nok: ok[0] + ok[1] };
    setPhase('ml_reveal', now, 9000);
    say(win.length ? 'The family says: ' + win.join(' and ') + '!' : 'Nobody voted.');
    fx(win.length ? 'right' : 'wrong');
  }

  /* ---------- closest call ---------- */
  function nextNum(now) {
    S.ni++;
    if (S.ni >= P.nq.length) { return roundEnd(now); }
    var it = P.nq[S.ni];
    S.nm = { n: S.ni + 1, of: P.nq.length, text: it.q };
    P.ng = {}; S.nv = 0; S.rv = null;
    setPhase('num_q', now, readMs(it.q) + 25000);
    say(it.q + ' Type your best guess.');
  }
  function endNum(now) {
    var it = P.nq[S.ni], list = [], pid;
    for (pid in P.ng) { if (P.ng.hasOwnProperty(pid) && pl(pid)) { list.push({ p: pid, v: P.ng[pid].v, d: Math.abs(P.ng[pid].v - it.a), at: P.ng[pid].at }); } }
    list.sort(function (x, y) { return (x.d - y.d) || (x.at - y.at); });
    var best = list[0] || null, show = [];
    for (var i = 0; i < list.length && i < 4; i++) { show.push({ n: nm(list[i].p), v: fmt(list[i].v, it.y), t: pl(list[i].p).t }); }
    var pts = best ? (best.d === 0 ? 200 : 150) : 0;
    if (best) { award(pl(best.p).t, pts, best.p); }
    S.rv = { a: fmt(it.a, it.y), list: show, who: best ? nm(best.p) : '', team: best ? pl(best.p).t : -1, pts: pts, exact: !!best && best.d === 0 };
    setPhase('num_reveal', now, 9000);
    say('The answer is ' + S.rv.a + '. ' + (best ? (S.rv.exact ? 'Exactly right, ' : 'Closest: ') + S.rv.who + '.' : ''));
    fx(best ? 'right' : 'wrong');
  }

  /* ---------- word scramble ---------- */
  function nextWord(now) {
    S.wi++;
    if (S.wi >= P.wq.length) { return roundEnd(now); }
    var it = P.wq[S.wi], mix = it.w, tries = 0;
    while (mix === it.w && tries < 12) { mix = shuffle(it.w.split('')).join(''); tries++; }
    P.word = it.w; P.wd = {};
    S.ws = { n: S.wi + 1, of: P.wq.length, mix: mix, hint: it.h, done: [] };
    S.wr = {}; S.rv = null;
    setPhase('scr_q', now, 35000);
    say('Unscramble the word. The hint is: ' + it.h + '.');
  }
  function endWord(now) {
    S.rv = { text: P.word, who: S.ws.done[0] || '', n: S.ws.done.length };
    setPhase('scr_reveal', now, 7000);
    say('The word was ' + P.word.toLowerCase() + '.' + (S.rv.who ? ' First in: ' + S.rv.who + '.' : ''));
    if (!S.rv.who) { fx('wrong'); }
  }

  /* ---------- crillion: the most obscure correct answer wins ---------- */
  function crNorm(t) { return String(t || '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9 ]/g, '').replace(/\b(the|a|an|lake|mount|mt|saint|st)\b/g, ' ').replace(/\s+/g, ' ').replace(/^ | $/g, ''); }
  var crWords = null;
  function crKnown() { // every answer on every Crillion sheet, right or wrong, as typed-exactly keys
    if (crWords) { return crWords; }
    crWords = {};
    (C.crillion || []).forEach(function (it) {
      it.a.forEach(function (x) { crWords[crNorm(x[0]).replace(/ /g, '')] = 1; (x[2] || []).forEach(function (al) { crWords[crNorm(al).replace(/ /g, '')] = 1; }); });
      (it.no || []).forEach(function (x) { crWords[crNorm(x[0]).replace(/ /g, '')] = 1; });
    });
    return crWords;
  }
  function crMatch(item, text) { // returns {st:'ok',name,said} | {st:'no',why} | {st:'ask'}
    var a = crNorm(text).replace(/ /g, ''), i, j, d, best = null, bd = 99, bad = null, nd = 99, tie = false;
    if (!a) { return { st: 'no', why: 'No answer.' }; }
    for (i = 0; i < item.no.length; i++) {
      d = near(a, crNorm(item.no[i][0]).replace(/ /g, ''));
      if (d === 0) { return { st: 'no', why: item.no[i][1] }; }
      if (d > 0 && d < nd) { nd = d; bad = item.no[i]; }
    }
    for (i = 0; i < item.a.length; i++) {
      var names = [item.a[i][0]].concat(item.a[i][2] || []);
      for (j = 0; j < names.length; j++) {
        d = near(a, crNorm(names[j]).replace(/ /g, ''));
        if (d >= 0 && d < bd) { bd = d; best = item.a[i]; tie = false; }
        else if (d >= 0 && d === bd && best !== item.a[i]) { tie = true; }
      }
    }
    if (best && bd === 0) { return { st: 'ok', name: best[0], said: best[1] }; }
    if (best && bd < nd && tie) { return { st: 'ask' }; }   // could be either of two answers
    if (best && bd < nd) {
      // close to a right answer. One guard: a correctly spelled, different answer from another sheet
      // ("Australia" when the sheet says "Austria") is not a typo, so a person decides.
      if (crKnown()[a]) { return { st: 'ask' }; }
      return { st: 'ok', name: best[0], said: best[1] };
    }
    if (bad && nd < bd) { return { st: 'no', why: bad[1] }; }
    return { st: 'ask' };
  }
  function nextCr(now) {
    S.ci++;
    if (S.ci >= P.cq.length) { return roundEnd(now); }
    var it = P.cq[S.ci];
    S.cr = { n: S.ci + 1, of: P.cq.length, text: it.q, rows: [] };
    P.crA = {}; S.nv = 0; S.rv = null;
    setPhase('cr_q', now, readMs(it.q) + 40000);
    say(it.q + ' Type one answer. The more obscure, the better.');
  }
  function crJudge(now) {
    var it = P.cq[S.ci], rows = [], ask = 0;
    for (var i = 0; i < S.order.length; i++) {
      var pid = S.order[i], a = P.crA[pid];
      if (!a || !pl(pid)) { continue; }
      var r = crMatch(it, a.text);
      if (r.st === 'ask') { ask++; }
      rows.push({ p: pid, n: nm(pid), t: pl(pid).t, text: a.text, st: r.st, name: r.name || '', said: r.said || 0, why: r.why || '', by: '' });
    }
    S.cr.rows = rows;
    if (ask) { setPhase('cr_judge', now, 75000); say('Some answers are not on my sheet. The judge decides.'); }
    else { crReveal(now); }
  }
  function crKey(r) { return crNorm(r.st === 'ok' ? r.name : r.text).replace(/ /g, ''); }
  function crReveal(now) {
    var rows = S.cr.rows, sum = [0, 0], den = [0, 0], i, r, same = {}, top = 0, nOk = 0;
    for (i = 0; i < rows.length; i++) { if (rows[i].st === 'ok') { same[crKey(rows[i])] = (same[crKey(rows[i])] || 0) + 1; nOk++; } }
    for (i = 0; i < rows.length; i++) {
      r = rows[i];
      r.dup = r.st === 'ok' ? same[crKey(r)] : 0;
      // rare on the sheet is good; the same answer as someone else in the room splits the points
      r.pts = r.st === 'ok' ? Math.max(1, Math.round((100 - r.said) / r.dup)) : 0;
      if (pl(r.p)) { pl(r.p).pts += r.pts; sum[pl(r.p).t] += r.pts; }
      if (r.pts > top) { top = r.pts; }
    }
    for (i = 0; i < S.order.length; i++) { var p = pl(S.order[i]); if (p && (P.crA[S.order[i]] || present(S.order[i], now))) { den[p.t]++; } }
    var gains = [0, 0];
    for (var t = 0; t < 2; t++) { gains[t] = den[t] ? Math.round(sum[t] / den[t]) : 0; if (!S.solo) { S.teams[t].score += gains[t]; } }
    rows.sort(function (x, y) { return y.pts - x.pts; });
    var winners = [], wtext = '';
    for (i = 0; i < rows.length; i++) { if (top > 0 && rows[i].pts === top) { winners.push(rows[i].n); wtext = rows[i].name; } }
    var allSame = nOk > 1 && winners.length === nOk && same[crKey(rows[0])] === nOk;
    var who = winners.length > 3 ? winners.length + ' players' : winners.join(' and ');
    S.rv = { gains: gains, who: who, text: winners.length === 1 || allSame ? wtext : '', pts: top, allSame: allSame };
    setPhase('cr_reveal', now, 14000);
    if (!top) { say('Nobody scored on that one.'); }
    else if (allSame) { say('Everybody said ' + wtext + '. The points are split ' + nOk + ' ways.'); }
    else if (winners.length === 1) { say('Most random: ' + who + ' with ' + wtext + ', for ' + top + ' points.'); }
    else { say('Most random: ' + who + ', with ' + top + ' points each.'); }
    fx(top ? 'right' : 'wrong');
  }

  /* ---------- round 2: the board ---------- */
  function setupBoard(now) {
    var cats = shuffle(range(C.board.length)).slice(0, cnt(5, 3));
    P.board = []; S.board = { cats: [], used: [] };
    for (var i = 0; i < cats.length; i++) {
      var cat = C.board[cats[i]], row = [];
      for (var l = 0; l < cat.levels.length; l++) { row.push(pickOne(cat.levels[l])); }
      P.board.push(row); S.board.cats.push(cat.name); S.board.used.push([0, 0, 0, 0]);
    }

      put('pnote', S && ui.failK && ui.failK === S.k ? '<div class="pnote bad">That did not reach the TV. Tap again.</div>' : (wr && !(S.acted && S.acted[pid]) ? '<div class="pnote bad">Not it. Try again. (' + wr + (wr === 1 ? ' try' : ' tries') + ')</div>' : ''));
      var ae = document.activeElement, html = bodyHtml();
      if (ae && ae.tagName === 'INPUT' && cache.pbody && cache.pbody.replace(/value="[^"]*"/g, '') === html.replace(/value="[^"]*"/g, '')) { /* keep */ }
      else if (ae && ae.tagName === 'INPUT' && ae.id === 'nm' && !ui.joined) { /* typing a name: wait */ }
      else if (ae && ae.tagName === 'INPUT' && (ae.id === 'tn0' || ae.id === 'tn1') && S && S.phase === 'lobby') { /* typing team names: wait */ }
      else if (ae && ae.tagName === 'INPUT' && (ae.id === 'wordin' || ae.id === 'numin' || ae.id === 'crin') && S && cache.pbodyK === S.k && !(S.acted && S.acted[pid]) && !sentHere()) { /* typing an answer: wait */ }
      else { var oldK = cache.pbodyK; if (put('pbody', html)) { cache.pbodyK = S ? S.k : ''; if (cache.pbodyK !== oldK) { cache.pbodyAt = Date.now(); } } }
      var boss = S && m && S.boss === pid && S.phase !== 'lobby' && S.phase !== 'menu' && S.phase !== 'final';
      var passive = S && /^intro$|_reveal$|^round_end$/.test(S.phase);
      put('pboss', boss ? '<div class="bossbar">' + (passive ? '<button data-a="c_next">NEXT</button>' : '<button class="alt wide" data-a="c_next">Skip this one</button>') + '<button class="alt" data-a="c_pause">' + (S.paused ? 'Go' : 'Pause') + '</button><button class="alt" data-a="c_menu">Menu</button></div>' : '');
      var sheet = '';
      if (boss && ui.menu) {
        var conn = '', tnow = S.now || Date.now();
        S.order.forEach(function (id) { var p = S.players[id]; if (p) { conn += esc(p.n) + ': ' + (tnow - p.seen > 10000 ? 'no signal' : (p.rtt ? (p.rtt < 700 ? 'good' : (p.rtt < 2000 ? 'slow' : 'very slow')) + ' (' + p.rtt + ' ms)' : 'checking')) + (p.late ? ', ' + p.late + ' late taps' : '') + '<br>'; } });
        sheet = '<div class="sheet"><button class="pbtn go" data-a="c_tomenu">Back to the game menu</button>' +
          (S.solo ? '' : '<div class="r2"><button class="pbtn plain c" data-a="c_adj" data-v="0,50">' + esc(tname(0)) + ' +50</button><button class="pbtn plain c" data-a="c_adj" data-v="0,-50">' + esc(tname(0)) + ' -50</button></div>' +
          '<div class="r2"><button class="pbtn plain c" data-a="c_adj" data-v="1,50">' + esc(tname(1)) + ' +50</button><button class="pbtn plain c" data-a="c_adj" data-v="1,-50">' + esc(tname(1)) + ' -50</button></div>') +
          '<h3>Phone connections</h3><div class="plist">' + conn + '</div>' +
          '<button class="pbtn plain c" data-a="c_end">Finish the show and see the winner</button><button class="pbtn dark" data-a="c_menu">Close</button></div>';
      }
      put('psheet', sheet);
      tickUI();
    }
    var GUARD = { ans: 1, vote: 1, mlv: 1, fpick: 1, tile: 1, c_next: 1, c_crj: 1 };
    function onAct(b) {
      var a = b.getAttribute('data-a'), v = b.getAttribute('data-v'), el;
      // A choice that shows up under a finger that was already tapping does not count: half a second of grace.
      if (GUARD[a] && Date.now() - (cache.pbodyAt || 0) < 550) { return; }
      if (a === 'team') { el = document.getElementById('nm'); if (el) { ui.name = el.value; } ui.team = +v; cache.pbody = null; put('pbody', bodyHtml()); return; }
      if (a === 'join') {
        el = document.getElementById('nm'); var name = (el ? el.value : ui.name).replace(/[<>]/g, '').replace(/^\s+|\s+$/g, '').substring(0, 14);
        if (!name) { if (el) { el.focus(); } return; }
        if (ui.team < 0) { if (S && S.solo) { ui.team = 0; } else { return; } }
        ui.name = name; ui.joined = true; lsSet('rc_name', name); lsSet('rc_room', ROOM); lsSet('rc_team', String(ui.team));
        wakeLock();
        if (el) { el.blur(); }
        hello();
      }
      else if (a === 'switch') { ui.team = 1 - pteam(pid); lsSet('rc_team', String(ui.team)); hello(); }
      else if (a === 'reload') { try { location.reload(true); } catch (e) { location.href = location.href; } return; }
      else if (!S) { return; }
      else if (a === 'vote') { doAct({ t: 'vote', a: +v }, S.q.kind === 'mix' ? 'ABCD'.charAt(+v) : S.q.o[+v]); }
      else if (a === 'mlv') { doAct({ t: 'mlv', v: v }, 'Voted'); }
      else if (a === 'num') { el = document.getElementById('numin'); if (!el || el.value === '' || isNaN(parseFloat(el.value))) { if (el) { el.focus(); } return; } var nval = parseFloat(el.value); el.blur(); doAct({ t: 'num', v: nval }, String(nval)); }
      else if (a === 'word') { el = document.getElementById('wordin'); if (!el || !el.value) { if (el) { el.focus(); } return; } send({ t: 'word', k: S.k, n: 1, text: el.value }); el.value = ''; return; }
      else if (a === 'c_play') { ctl('play', { key: v }); try { window.scrollTo(0, 0); } catch (e) { } }
      else if (a === 'c_short') { ctl('short', { on: !S.short }); }
      else if (a === 'c_solo') { ctl('solo', { on: v === '1' }); }
      else if (a === 'c_crj') { var cj = v.split(','); ctl('crj', { p: cj[0], ok: cj[1] === '1', said: 5, by: 'the showrunner' }); }
      else if (a === 'cr') { el = document.getElementById('crin'); if (!el || !el.value.replace(/\s/g, '')) { if (el) { el.focus(); } return; } var ctxt = el.value; el.blur(); doAct({ t: 'cr', text: ctxt }, ctxt); }
      else if (a === 'c_tomenu') { ctl('menu'); ui.menu = false; }
      else if (a === 'tile') { var cl = v.split(','); doAct({ t: 'pick', c: +cl[0], l: +cl[1] }, 'Picked'); }
      else if (a === 'buzz') { if (S.phase !== 'phrase_turn' && hnow() < (S.openAt || 0) - 150) { return; } if (sentHere()) { return; } try { if (navigator.vibrate) { navigator.vibrate(60); } } catch (e) { } doAct({ t: 'buzz' }, 'Buzzed'); }
      else if (a === 'ans') { doAct({ t: 'ans', a: +v }, S.phase === 'board_q' && S.q && S.q.o ? S.q.o[+v] : 'Answer sent'); }
      else if (a === 'letter') { doAct({ t: 'letter', l: v }, v); }
      else if (a === 'solve') { el = document.getElementById('solve'); if (!el || !el.value) { return; } var txt = el.value; el.blur(); doAct({ t: 'solve', text: txt }, 'Sent'); }
      else if (a === 'fpick') { doAct({ t: 'fpick', o: +v }, 'Answer sent'); }
      else if (a === 'c_next') { ctl('next', { k: S.k }); }
      else if (a === 'c_pause') { ctl('pause'); }
      else if (a === 'c_menu') { ui.menu = !ui.menu; }
      else if (a === 'c_end') { ctl('end'); ui.menu = false; }
      else if (a === 'c_again') { ctl('again'); }
      else if (a === 'c_adj') { var ad = v.split(','); ctl('adj', { team: +ad[0], d: +ad[1] }); }
      else if (a === 'c_names') { var a0 = document.getElementById('tn0'), a1 = document.getElementById('tn1'); if (a0 && a1) { a0.blur(); a1.blur(); ctl('teams', { names: [a0.value, a1.value] }); } }
      else if (a === 'c_preset') { ctl('teams', { names: ['Kids', 'Adults'] }); }
      render();
    }
    var lastTouch = 0;
    app.addEventListener('touchstart', function (e) { var b = closest(e.target, 'data-a'); if (b && b.getAttribute('data-a') === 'buzz' && !b.disabled) { lastTouch = Date.now(); onAct(b); } });
    app.addEventListener('click', function (e) {
      var b = closest(e.target, 'data-a'); if (!b || b.disabled) { return; }
      if (b.getAttribute('data-a') === 'buzz' && Date.now() - lastTouch < 700) { return; }
      onAct(b);
    });
    render();
  }

  if (ROLE === 'screen') { screen(); } else if (ROLE === 'play') { phone(); } else { home(); }
})();

</script>
